# Revnote CI — checks first, API image last.
#
#   * The image job depends on the check jobs, so a red test can never publish.
#   * Images are built ONLY here; local `docker build` is prohibited.
#   * Pull requests never push and never receive a registry token.
#   * Pushes to main and manual dispatches publish to
#     ghcr.io/<lowercase owner>/revnote-api using the workflow GITHUB_TOKEN.
#   * Permissions are minimal: `contents: read`, plus `packages: write` on the
#     image job only.
#
# Test groups (each is its own step with its own JUnit report, and each is
# guarded by the no-skip check — a group with zero cases, one skip or one
# failure is a red build):
#
#   unit             no external service
#   integration      real PostgreSQL, sequential kernel behaviour
#   concurrency      real PostgreSQL, independent connections
#   migrations       destructive round trips on a disposable database
#   api-http         /api/v1 over an in-process ASGI client
#   api-http-concurrency  real PostgreSQL + concurrent HTTP requests
#   api-transport    a real TCP socket served by uvicorn (disconnect, RST)
#   api-attachments  real PostgreSQL + real MinIO (its own job, below)
#
# The first seven are produced and guarded by the `api` job. The eighth needs a
# real object store, so it runs in `api-attachments` and is guarded there by
# `check_test_reports.py --group attachments` — a job can only guard reports it
# actually produced.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default, then grant per job.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run, but a publishing run
# is never cancelled halfway through a layer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  UV_NO_PROGRESS: "1"
  # Hardlinking across the cache/venv boundary is unreliable in containers.
  UV_LINK_MODE: "copy"
  # Pinned type-checker; a floating `ty` would change its diagnostics on its own
  # schedule and turn unrelated commits red.
  TY_VERSION: "0.0.94"

jobs:
  # ------------------------------------------------------------------------- #
  # API: lint + types + unit tests + real-PostgreSQL integration tests
  #      + HTTP/API groups + migration gate
  # ------------------------------------------------------------------------- #
  api:
    name: api (lint + types + unit + postgres integration + http + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    services:
      postgres:
        # Official Docker Official Image, pinned to the same version as
        # docker-compose.yml. A real server: the scaffold is PostgreSQL-only.
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_USER: revnote
          POSTGRES_PASSWORD: revnote_ci_only_password
          POSTGRES_DB: revnote_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username revnote --dbname revnote_ci --timeout=5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    env:
      # Gates the PostgreSQL integration tests: with this set, those tests must
      # connect or the job fails. DATABASE_URL and APP_ENV are intentionally NOT
      # set here — the unit tests assert their defaults, so a job-wide value
      # would break unrelated assertions. They are injected per step instead.
      TEST_DATABASE_URL: postgresql+asyncpg://revnote:revnote_ci_only_password@127.0.0.1:5432/revnote_ci
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://revnote:revnote_ci_only_password@127.0.0.1:5432/revnote_ci_migrations
      REQUIRE_POSTGRES_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            apps/api/pyproject.toml

      - name: Sync workspace from the lock file
        # --locked fails when uv.lock disagrees with pyproject.toml rather than
        # quietly re-resolving.
        run: uv sync --locked

      - name: Prepare a separate disposable migration database
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              url = os.environ["TEST_DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1)
              conn = await asyncpg.connect(url)
              try:
                  await conn.execute("CREATE DATABASE revnote_ci_migrations")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Lint (ruff check)
        run: uv run ruff check apps/api

      - name: Format check (ruff format)
        run: uv run ruff format --check apps/api

      - name: Type check the production modules (ty, pinned)
        # The plan's §14.2 list, spelled out as explicit paths (and globs) so a new
        # module cannot silently slip past the checker. A directory form would also
        # pull in modules whose diagnostics belong to the lane that owns them, which
        # is how a shared check turns into a cross-lane edit war.
        # No global ignore file: a diagnostic is fixed at its source or the build
        # stays red.
        run: |
          # `--extra-search-path` names where `pg_support` really lives. The E2E
          # runner imports it deliberately late (after adding the path at runtime),
          # so the checker has to be told the same thing rather than the import
          # being suppressed.
          uvx --from "ty==${TY_VERSION}" ty check --extra-search-path apps/api/tests \
            apps/api/src/revnote_api/api \
            apps/api/src/revnote_api/security \
            apps/api/src/revnote_api/models \
            apps/api/src/revnote_api/services/auth.py \
            apps/api/src/revnote_api/services/auth_rules.py \
            apps/api/src/revnote_api/services/sync_push_adapter.py \
            apps/api/src/revnote_api/services/sync_read.py \
            apps/api/src/revnote_api/services/sync_write.py \
            apps/api/src/revnote_api/kernel/results.py \
            apps/api/src/revnote_api/config.py \
            apps/api/src/revnote_api/main.py \
            apps/api/scripts/run_web_e2e.py \
            apps/api/scripts/check_test_reports.py

      - name: Unit tests (must pass with no external service)
        # Proves create_app() boots and serves / with /health while PostgreSQL and
        # MinIO are absent — the scaffold's core promise.
        run: uv run pytest apps/api/tests/unit -v --junitxml=api-unit.xml

      - name: PostgreSQL sequential behavior tests
        run: uv run pytest apps/api/tests/integration -v -m "integration and not concurrency and not migrations" --junitxml=api-integration.xml

      - name: PostgreSQL concurrent and atomicity proofs
        run: uv run pytest apps/api/tests/integration/kernel -v -m concurrency --junitxml=api-concurrency.xml

      - name: Migration roundtrips on the separate disposable database
        run: uv run pytest apps/api/tests/integration/test_migrations.py -v --junitxml=api-migrations.xml

      - name: HTTP API behaviour (in-process ASGI client, real PostgreSQL)
        # `api` covers auth, push, pull, snapshot and the read endpoints. The
        # concurrency and transport proofs have their own groups below, so this
        # step is the deterministic, sequential tier.
        #
        # `attachments` is excluded because those cases carry the `api` marker
        # too but need a real MinIO this job does not run. Selecting them here
        # would not skip them: `GITHUB_ACTIONS` makes
        # `object_storage_is_required()` true, so a missing store is a hard
        # failure and this step would go red for a reason unrelated to the
        # seven groups it guards. They run in `api-attachments` instead, where
        # `image.needs` gates on them.
        run: uv run pytest apps/api/tests/api -v -m "api and not api_concurrency and not transport and not attachments" --junitxml=api-http.xml

      - name: HTTP API concurrency proofs (independent PostgreSQL connections)
        # Dense sequence allocation over HTTP, pull during push, the N+1
        # invisibility rule, the snapshot's REPEATABLE READ view, one winner for a
        # concurrently replayed refresh token (R1) and one account for a
        # concurrently registered address.
        run: uv run pytest apps/api/tests/api -v -m api_concurrency --junitxml=api-http-concurrency.xml

      - name: HTTP transport proofs (real TCP socket served by uvicorn)
        # A disconnect is only real over a socket: these cases reset a TCP
        # connection mid-batch and prove what was committed, never claiming a
        # rollback. ASGITransport cannot produce one, so it is not used here.
        run: uv run pytest apps/api/tests/api -v -m transport --junitxml=api-transport.xml

      - name: Guard - every PostgreSQL and HTTP group ran, passed, and skipped nothing
        # A skip is NOT an acceptance check. Parsing the JUnit XML (not grepping
        # it) avoids `set -o pipefail` failing when there is nothing to match, and
        # counts real elements rather than lines.
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          # Names are the load-bearing cases from the phase 3 prompt; an
          # equivalently named case is acceptable but the *set* below must be
          # present in the report, or the group silently shrank.
          #
          # This table covers exactly the seven reports this job produces. The
          # eighth group (api-attachments.xml) needs a real MinIO, is produced by
          # the `api-attachments` job, and is pinned there by
          # `check_test_reports.py --group attachments`. Requiring it here would
          # ask this job for a file it never generates.
          required = {
              "api-unit.xml": set(),
              "api-integration.xml": {
                  "test_create_folder_writes_rev1_and_one_event",
                  "test_note_can_share_a_uuid_with_the_folder_it_lives_in",
                  "test_statement_timeout_real_57014",
              },
              "api-concurrency.xml": {
                  "test_eight_producers_allocate_a_dense_sequence",
                  "test_same_op_from_many_connections_writes_once",
                  "test_cas_race_has_exactly_one_winner",
                  "test_ledger_backstop_returning_false_replays_the_recorded_result",
                  "test_three_connection_visibility_then_commit",
                  "test_three_connection_visibility_then_rollback_reuses_the_seq",
                  "test_lost_commit_ack_is_durable_and_retry_replays",
                  "test_lock_timeout_metrics",
                  "test_cancel_before_commit_rolls_back_and_propagates",
                  "test_cancel_during_commit_is_cancelled_and_discards_the_connection",
              },
              "api-migrations.xml": {
                  "test_full_round_trip_and_reapply",
                  "test_alembic_check_reports_no_diff",
              },
              "api-http.xml": {
                  "test_refresh_rotates_the_pair_once",
                  "test_workspace_access_denies_non_members_with_not_found",
                  "test_http_push_six_statuses_are_wire_contract",
                  "test_http_push_per_op_failure_is_an_error_object_not_a_code",
                  "test_http_push_per_op_membership_loss_is_not_found",
                  "test_http_push_duplicate_op_id_executes_nothing",
                  "test_http_push_caps_reject_the_whole_batch",
                  "test_http_push_lock_timeout_stops_the_batch",
                  "test_http_push_unknown_is_retried_by_the_same_op_id",
                  "test_http_push_prebuild_catches_what_the_schema_cannot",
                  "test_http_push_structural_batch_errors_reject_everything",
                  "test_http_push_unhashable_discriminator_is_a_400",
                  "test_http_push_repr_never_leaks_note_content",
                  "test_id_conflict_origin_hidden",
                  "test_secrets_never_echo",
                  "test_pull_since_is_exclusive_and_cursor_chains",
                  "test_pull_cursor_bounds_and_floor",
                  "test_pull_objects_are_deduplicated_and_lead_their_events",
                  "test_snapshot_has_no_partial_success",
                  "test_snapshot_bootstraps_from_one_watermark",
                  "test_tree_and_note_reads_hide_content_and_deletions",
                  "test_a_legacy_oversize_body_is_refused_by_both_reads",
              },
              "api-http-concurrency.xml": {
                  "test_http_push_dense_seq",
                  "test_http_pull_during_push",
                  "test_pull_cannot_observe_n_plus_one_first",
                  "test_snapshot_is_one_rr_view",
                  "test_concurrent_refresh_same_token_has_one_winner",
                  "test_concurrent_registration_of_one_address_creates_one_account",
              },
              "api-transport.xml": {
                  "test_socket_disconnect_stops_batch",
                  "test_commit_survives_a_lost_response",
                  "test_the_probe_serves_http_on_a_real_socket",
              },
          }
          for path, names in required.items():
              try:
                  cases = list(ET.parse(path).getroot().iter("testcase"))
              except (OSError, ET.ParseError) as exc:
                  print(f"::error::{path}: {exc}")
                  sys.exit(1)
              rejected = [c for c in cases if any(c.find(tag) is not None for tag in ("skipped", "failure", "error"))]
              missing = names - {c.attrib.get("name") for c in cases}
              print(f"{path}: tests={len(cases)} rejected={len(rejected)} missing={sorted(missing)}")
              if not cases or rejected or missing:
                  print(f"::error::acceptance incomplete: {path}")
                  sys.exit(1)
          PY

      - name: Reusable API report guard (same seven-group inventory)
        # Named group by group rather than left to the default: the script's default
        # is all eight, and the eighth (api-attachments) is produced by the
        # `api-attachments` job, not here. The same seven-file slice is what the
        # inline guard above pins by case name.
        run: |
          uv run python apps/api/scripts/check_test_reports.py \
            --group unit \
            --group integration \
            --group concurrency \
            --group migrations \
            --group http \
            --group http-concurrency \
            --group transport

      - name: Alembic upgrade head (documented repo-root command)
        # Alembic reads DATABASE_URL from Settings, so it is supplied here only —
        # never at job level, where it would break the unit tests' default checks.
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Alembic current
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic -c apps/api/alembic.ini current

      - name: Check model and migration agreement
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic -c apps/api/alembic.ini check

      - name: Verify exactly the Phase 5 domain tables exist
        # Inspect the real catalog; the eleven domain tables of phases 2-3-5
        # (kernel six + auth four + attachments one) and nothing else. Detailed
        # constraints are verified by PostgreSQL tests.
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          set -eu
          # Written outside the workspace so it can never be picked up as a
          # tracked file or leak into a later `git status` check.
          helper="${RUNNER_TEMP:-/tmp}/check-schema.py"
          cat > "$helper" <<'PY'
          import asyncio
          import os
          import re

          import asyncpg

          dsn = re.sub(
              r"^postgresql\+asyncpg://",
              "postgresql://",
              os.environ["DATABASE_URL"],
          )


          async def main() -> int:
              conn = await asyncpg.connect(dsn=dsn)
              try:
                  rows = await conn.fetch(
                      "SELECT tablename FROM pg_tables"
                      " WHERE schemaname = current_schema() ORDER BY tablename"
                  )
              finally:
                  await conn.close()

              tables = [row["tablename"] for row in rows]
              print(f"tables after 'upgrade head': {tables}")

              expected = {
                  "alembic_version",
                  # phase 2 kernel
                  "users",
                  "workspaces",
                  "folders",
                  "notes",
                  "change_events",
                  "op_ledger",
                  # phase 3 auth
                  "auth_sessions",
                  "auth_access_tokens",
                  "auth_refresh_tokens",
                  "workspace_members",
                  # phase 5 attachments
                  "attachments",
              }
              if set(tables) != expected:
                  print(f"::error::schema mismatch: expected {sorted(expected)}, got {tables}")
                  return 1
              print("OK: Phase 5 schema applied, exactly eleven domain tables")
              return 0


          raise SystemExit(asyncio.run(main()))
          PY
          uv run python "$helper"

      - name: Alembic downgrade base on migration database only
        env:
          DATABASE_URL: ${{ env.TEST_MIGRATION_DATABASE_URL }}
        run: uv run alembic -c apps/api/alembic.ini downgrade base

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: |
            api-unit.xml
            api-integration.xml
            api-concurrency.xml
            api-migrations.xml
            api-http.xml
            api-http-concurrency.xml
            api-transport.xml
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------------- #
  # Attachments: real PostgreSQL + real MinIO, one case per load-bearing claim
  # of plan §7.1. Its own job because a fake store cannot satisfy these: the
  # digest is recomputed by re-reading the object, the single winner is decided
  # by a row lock plus a CAS predicate, and the GC case lists the real bucket.
  # ------------------------------------------------------------------------- #
  api-attachments:
    name: api-attachments (real PostgreSQL + real MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        # Same server and same options as the `api` job, with its own database so
        # the two jobs can never read or poison each other's rows.
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_USER: revnote
          POSTGRES_PASSWORD: revnote_ci_only_password
          POSTGRES_DB: revnote_attachments_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username revnote --dbname revnote_attachments_ci --timeout=5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s


    env:
      # Both promises are gates, not hints: with these set, a test that cannot
      # reach PostgreSQL or the object store fails hard and never skips (D14).
      # DATABASE_URL and APP_ENV stay unset for the same reason as the `api` job.
      TEST_DATABASE_URL: postgresql+asyncpg://revnote:revnote_ci_only_password@127.0.0.1:5432/revnote_attachments_ci
      # Required by pg_targets, which proves the business and migration DSNs are
      # two different databases. No migration round trip runs in this job, so
      # nothing ever connects to it; a missing database is therefore not a fault.
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://revnote:revnote_ci_only_password@127.0.0.1:5432/revnote_attachments_ci_migrations
      REQUIRE_POSTGRES_TESTS: "1"
      REQUIRE_OBJECT_STORAGE_TESTS: "1"
      # Read only by the MinIO start step, so the credential appears in one place.
      MINIO_CI_ACCESS_KEY: revnote_minio_ci_only_user
      MINIO_CI_SECRET_KEY: revnote_minio_ci_only_password
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET: revnote-attachments-ci
      OBJECT_STORAGE_ACCESS_KEY: revnote_minio_ci_only_user
      OBJECT_STORAGE_SECRET_KEY: revnote_minio_ci_only_password
      OBJECT_STORAGE_SECURE: "false"
      ATTACHMENTS_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            apps/api/pyproject.toml

      - name: Sync workspace from the lock file
        run: uv sync --locked

      - name: Start the pinned MinIO (official release binary)
        # The official container images are no longer anonymously pullable: quay.io
        # answers 401 for every tag and Docker Hub no longer hosts `minio/minio`, so a
        # `services: minio` block fails the job before a single step runs. `dl.min.io`
        # is 410 Gone as well. MinIO still publishes this exact release on its own
        # GitHub releases, so the Linux amd64 binary is fetched from there and verified
        # against the hash published beside it - same release, same provenance,
        # different official channel. Not a rebuild, not a different S3 product.
        env:
          MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
          MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
        run: |
          set -euo pipefail
          asset="minio.linux-amd64.${MINIO_RELEASE}"
          curl -fsSL --retry 3 -o /tmp/minio \
            "https://github.com/minio/minio/releases/download/${MINIO_RELEASE}/${asset}"
          echo "${MINIO_SHA256}  /tmp/minio" | sha256sum -c -
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          # A background process outlives its step on a GitHub runner, which is why the
          # server is started here and polled in the next step rather than in one block.
          MINIO_ROOT_USER="${MINIO_CI_ACCESS_KEY}" \
          MINIO_ROOT_PASSWORD="${MINIO_CI_SECRET_KEY}" \
            nohup /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 \
              --console-address 127.0.0.1:0 > /tmp/minio.log 2>&1 &
      - name: Wait for object storage and create the bucket
        # The project's own code, not a poller image and not `mc`: readiness is
        # `probe_store` (list_buckets) which answers "the store is reachable and
        # accepts our credentials" and needs no bucket to exist. Polling
        # `ready()` here would deadlock - it is `bucket_exists`, and the bucket
        # is created by the very next call.
        run: |
          uv run python - <<'PY'
          import time

          from revnote_api.storage.bootstrap import ensure_bucket, probe_store
          from revnote_api.storage.s3 import S3BlobStore
          from revnote_api.storage.settings import ObjectStorageSettings

          # Bounded, and generous: a real probe costs one call on a warm store,
          # so the deadline only matters when the service is slow to listen.
          DEADLINE_S = 120.0
          INTERVAL_S = 2.0

          store = S3BlobStore(ObjectStorageSettings())
          deadline = time.monotonic() + DEADLINE_S
          while time.monotonic() < deadline:
              if probe_store(store):
                  break
              time.sleep(INTERVAL_S)
          else:
              raise SystemExit(
                  f"object storage at {store.settings.masked_endpoint} did not answer "
                  f"before the {DEADLINE_S:.0f}s deadline; no bucket was created."
              )
          print(f"reachable: {store.settings.diagnostics}")
          print(f"bucket ready: {ensure_bucket(store)}")
          PY

      - name: Attachment HTTP behaviour (real PostgreSQL + real MinIO)
        # upload/download byte identity, the re-read digest, immutability once
        # ready, one winner for two concurrent uploads, the refusal planes, the
        # non-member 404 collapse, and the GC that lists the real bucket.
        run: uv run pytest apps/api/tests/api -m attachments -v --junitxml=api-attachments.xml

      - name: Guard - the twelve attachment cases ran, passed, and skipped nothing
        # The same treatment the `api` job gives its seven groups: parse the JUnit
        # XML and count real elements, so an equivalently named case cannot
        # substitute for a missing one and a skip is never acceptance. Kept in
        # lockstep with check_test_reports.py's api-attachments entry; the script
        # below is the authority, this is the readable copy in the file.
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          # One name per load-bearing claim of plan §7.1.
          required = {
              # §2 the whole happy path, bytes verified byte-identical.
              "test_upload_then_download_is_byte_identical",
              # D6: a re-read digest, not an ETag or a client claim.
              "test_the_declared_digest_is_verified_against_the_stored_bytes",
              "test_a_wrong_declared_digest_is_refused_and_leaves_no_ready_row",
              # D5: the object is immutable once ready.
              "test_a_second_upload_to_a_ready_attachment_is_refused_and_changes_nothing",
              # D5: one winner, one object, for two concurrent PUTs.
              "test_two_concurrent_uploads_produce_one_winner_and_one_object",
              # A lost response plus a client retry is still one ready row.
              "test_replaying_the_same_upload_after_a_commit_is_still_one_row",
              # D20: metadata, content and upload all collapse to 404 for a non-member.
              "test_a_non_member_cannot_read_metadata_content_or_upload",
              # 413 and 400 on the two refusal planes.
              "test_a_declared_size_over_the_cap_is_attachment_too_large",
              "test_an_svg_upload_is_refused",
              # D3: an attachment never touches the sync kernel.
              "test_an_attachment_never_moves_the_sync_cursor_or_the_event_log",
              # D8: the GC collects expired pending rows and leaves ready ones.
              "test_gc_removes_expired_pending_rows_and_leaves_ready_ones",
              # interface §4: the immutable four-segment storage key.
              "test_the_object_lives_under_the_contract_key",
          }
          path = "api-attachments.xml"
          try:
              cases = list(ET.parse(path).getroot().iter("testcase"))
          except (OSError, ET.ParseError) as exc:
              print(f"::error::{path}: {exc}")
              sys.exit(1)
          rejected = [c for c in cases if any(c.find(tag) is not None for tag in ("skipped", "failure", "error"))]
          missing = required - {c.attrib.get("name") for c in cases}
          print(f"{path}: tests={len(cases)} rejected={len(rejected)} missing={sorted(missing)}")
          if not cases or rejected or missing:
              print(f"::error::acceptance incomplete: {path}")
              sys.exit(1)
          PY

      - name: Guard the attachment acceptance report
        # Focused-group mode on purpose: this job produces one of the eight report
        # groups, so demanding the other seven here would ask for files it never
        # generates. The `api` job's guard covers its own seven.
        run: uv run python apps/api/scripts/check_test_reports.py --group attachments

      - name: Upload the attachments test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-attachments-reports
          path: api-attachments.xml
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------------- #
  # Web: lint, typecheck, production build, Markdown round-trip check
  # ------------------------------------------------------------------------- #
  web:
    name: web (lint + typecheck + build + markdown + unit + components)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # Version comes from the repo's own `packageManager` field, so CI cannot
        # drift from a developer machine. Must run before setup-node's pnpm cache.
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Show toolchain versions
        run: node --version && pnpm --version

      - name: Install dependencies
        # --frozen-lockfile: fail rather than silently rewriting pnpm-lock.yaml.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @revnote/web lint

      - name: Typecheck
        run: pnpm --filter @revnote/web typecheck

      - name: Build
        run: pnpm --filter @revnote/web build

      - name: Markdown round-trip check
        # Exercises the TipTap Markdown serializer/parser (basic node semantics
        # only — no LaTeX/HTML/whitespace guarantees). It is a script, not a
        # Markdown linter, and needs no browser or API.
        run: pnpm --filter @revnote/web check:markdown

      - name: Unit and component tests
        run: pnpm test:web

      - name: Guard Web unit and component reports
        run: pnpm --filter @revnote/web check:reports --unit

  web-e2e:
    name: web-e2e (Chromium + native API + real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_USER: revnote
          POSTGRES_PASSWORD: revnote_ci_only_password
          POSTGRES_DB: revnote_web_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username revnote --dbname revnote_web_e2e_ci --timeout=5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    env:
      WEB_E2E_DATABASE_URL: postgresql+asyncpg://revnote:revnote_ci_only_password@127.0.0.1:5432/revnote_web_e2e_ci
      REQUIRE_POSTGRES_TESTS: "1"
      # External mode: the runner creates its own per-run bucket in this store and
      # passes the values to its children, instead of trying to own a MinIO process
      # (owned mode pins the Windows binary, which cannot exist on a Linux runner).
      WEB_E2E_MINIO_ENDPOINT: http://127.0.0.1:9000
      WEB_E2E_MINIO_ACCESS_KEY: revnote_minio_ci_only_user
      WEB_E2E_MINIO_SECRET_KEY: revnote_minio_ci_only_password
      REQUIRE_OBJECT_STORAGE_TESTS: "1"
      MINIO_CI_ACCESS_KEY: revnote_minio_ci_only_user
      MINIO_CI_SECRET_KEY: revnote_minio_ci_only_password
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Sync Python workspace
        run: uv sync --locked
      - name: Start the pinned MinIO (official release binary)
        # The official container images are no longer anonymously pullable: quay.io
        # answers 401 for every tag and Docker Hub no longer hosts `minio/minio`, so a
        # `services: minio` block fails the job before a single step runs. `dl.min.io`
        # is 410 Gone as well. MinIO still publishes this exact release on its own
        # GitHub releases, so the Linux amd64 binary is fetched from there and verified
        # against the hash published beside it - same release, same provenance,
        # different official channel. Not a rebuild, not a different S3 product.
        env:
          MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
          MINIO_SHA256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
        run: |
          set -euo pipefail
          asset="minio.linux-amd64.${MINIO_RELEASE}"
          curl -fsSL --retry 3 -o /tmp/minio \
            "https://github.com/minio/minio/releases/download/${MINIO_RELEASE}/${asset}"
          echo "${MINIO_SHA256}  /tmp/minio" | sha256sum -c -
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          # A background process outlives its step on a GitHub runner, which is why the
          # server is started here and polled in the next step rather than in one block.
          MINIO_ROOT_USER="${MINIO_CI_ACCESS_KEY}" \
          MINIO_ROOT_PASSWORD="${MINIO_CI_SECRET_KEY}" \
            nohup /tmp/minio server /tmp/minio-data --address 127.0.0.1:9000 \
              --console-address 127.0.0.1:0 > /tmp/minio.log 2>&1 &
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @revnote/web exec playwright install --with-deps chromium
      - name: Browser through API to PostgreSQL
        run: pnpm test:e2e
      - name: Guard browser acceptance report
        run: pnpm --filter @revnote/web check:reports --e2e

  # ------------------------------------------------------------------------- #
  # API image -> GHCR, only after every check is green.
  # ------------------------------------------------------------------------- #
  image:
    name: image (build + push to GHCR)
    needs: [api, api-attachments, web, web-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Skipped for every pull_request (including same-repo PRs) and therefore for
    # fork PRs, which must never receive a registry token. Publishing happens on
    # main pushes and manual dispatches only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the image reference
        id: img
        # GHCR paths must be lowercase, but owner logins can contain uppercase.
        # Fail closed if the event ever resolves to an empty owner.
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ -z "${OWNER}" ]; then
            echo "::error::github.repository_owner is empty; refusing to build a broken reference."
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')/revnote-api"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "Image reference: ${image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=revnote-api
            org.opencontainers.image.description=Revnote API (auth + native sync v1)

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Context is the REPOSITORY ROOT: the API image resolves the root uv
          # workspace (root pyproject.toml + uv.lock + the apps/api member).
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=revnote-api
          cache-to: type=gha,mode=max,scope=revnote-api

      - name: Summarise the pushed image
        run: |
          {
            echo "### revnote-api image"
            echo
            echo "Pushed to \`${{ steps.img.outputs.name }}\`:"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Commit: \`${{ github.sha }}\` · event: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
