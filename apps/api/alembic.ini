# Alembic config for Revnote API (async, PostgreSQL + asyncpg).
#
# Run it from the REPOSITORY ROOT (that is also where the shared uv `.venv`
# lives), passing the -c flag:
#
#   uv run alembic -c apps/api/alembic.ini upgrade head
#   uv run alembic -c apps/api/alembic.ini downgrade base
#   uv run alembic -c apps/api/alembic.ini current
#   uv run alembic -c apps/api/alembic.ini revision -m "message"
#
# Paths below use the Alembic-provided %(here)s token, which expands to the
# directory containing THIS file. That keeps `-c apps/api/alembic.ini` correct
# from the repo root (and incidentally from apps/api too), instead of silently
# depending on the current working directory.
#
# The database URL is deliberately NOT stored here: migrations/env.py reads it
# from revnote_api.config.Settings (single source of truth), so only
# DATABASE_URL / .env controls it.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os
path_separator = os
timezone = UTC

# Timestamped revision filenames, e.g. 20260101_1200_abcd1234_add_note.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Intentionally empty - supplied at runtime by env.py so a stale URL can never
# be picked up by accident. The only supported driver is postgresql+asyncpg.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# --------------------------------------------------------------------------- #
# Logging
# --------------------------------------------------------------------------- #
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
