[project]
name = "revnote-api"
version = "0.1.0"
description = "Revnote API service — scaffold only (FastAPI + async SQLAlchemy + PostgreSQL/asyncpg)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "greenlet>=3.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
# `uv run revnote-api` -> uvicorn on the app factory (dev convenience).
revnote-api = "revnote_api.__main__:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revnote_api"]

[tool.hatch.build.targets.sdist]
include = ["src/revnote_api", "tests", "migrations", "alembic.ini", "README.md"]
