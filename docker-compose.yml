# Revnote — local development infrastructure (PostgreSQL + RustFS).
#
# Scope: starts the official PostgreSQL image and a RustFS S3-compatible store. It
# deliberately does NOT build or run the API/Web images — those run on the host via
# uv/pnpm, and the API image is built only by GitHub Actions (see
# docs/build-conventions.md). There are no `build:` keys here on purpose.
#
#   docker compose up -d
#   docker compose ps -a
#   docker compose logs rustfs
#   docker compose down            # keeps the named volumes
#
# Configuration comes from the repository-root `.env` (copy `.env.example`).
#
# --------------------------------------------------------------------------- #
# OBJECT STORE - RustFS (read before changing, and before claiming this stack works).
#
# The store is RustFS 1.0.4 (Apache-2.0), pinned to an official GitHub release. It replaced
# an earlier design whose official images were withdrawn: the registry answered 401 for
# every tag, the Docker Hub repository disappeared and the download host answered 410.
# The measurement is recorded in docs/phase5-validation.md; it is not repeated here so a
# withdrawn vendor name does not linger in the configuration.
#
# RustFS is distributed as a release archive, not as a pullable image we could verify, so
# this service runs the official binary inside a minimal base image rather than inventing
# a tag or digest we cannot justify. The archive's SHA-256 is verified before it runs.
# CI does the equivalent directly on the runner.
#
# The console address MUST be given explicitly: RustFS refuses to start without it.
#
# No digest is pinned here because none could be retrieved; do not invent one. Do not
# substitute a third-party rebuild or a different S3 product - that would change what the
# acceptance run proves.
#
# UNVERIFIED: this service has never been started on a host with a Docker daemon (the
# implementation environment has none). CI exercises the same binary directly instead, so
# the acceptance evidence comes from that path, not from this file.
# --------------------------------------------------------------------------- #

services:
  postgres:
    # Official Docker Official Image; exact patch version, never `latest`.
    image: postgres:17.11-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required - copy .env.example to .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback only: never expose a development database on the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` ships in the official postgres image (verified present in
      # 17-alpine3.23 at /usr/local/bin/pg_isready).
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" --timeout=5
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

  rustfs:
    # Minimal base image plus the pinned official archive; see the banner for why this is
    # not an image reference to the store itself.
    image: debian:12-slim
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required, min 8 chars}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        apt-get update >/dev/null && apt-get install -y --no-install-recommends curl ca-certificates unzip >/dev/null
        curl -fsSL -o /tmp/rustfs.zip "https://github.com/rustfs/rustfs/releases/download/1.0.4/rustfs-linux-x86_64-musl-v1.0.4.zip"
        echo "4924ad4b699b9f59943051efedae2d1eb6d4cac503a1b0384c4b25f7c2c31b5c  /tmp/rustfs.zip" | sha256sum -c -
        unzip -q -o /tmp/rustfs.zip -d /opt/rustfs
        chmod +x /opt/rustfs/rustfs
        exec /opt/rustfs/rustfs server --address 0.0.0.0:9000 --console-address 0.0.0.0:9001 /data
    ports:
      # Loopback only, like the database.
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    # No healthcheck: the readiness probe is the project's own (`probe_store`), which
    # runs from the API/test harness, so an in-container check would assert a different
    # thing than the code that actually depends on it.

volumes:
  # Named volumes: `docker compose down` keeps the data, `down -v` destroys it.
  postgres-data:
  rustfs-data:
